name: Prepare licensed service images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install image converter without changing package files
        run: npm install --no-save --package-lock=false sharp
      - name: Download, validate and convert source photos to WebP
        run: node scripts/prepare-service-images.mjs
      - name: Upload prepared photos and source metadata for review
        uses: actions/upload-artifact@v4
        with:
          name: inbs-service-images
          path: |
            public/images/services/*.webp
            public/images/services/SOURCES.json
          if-no-files-found: error
          retention-days: 7
