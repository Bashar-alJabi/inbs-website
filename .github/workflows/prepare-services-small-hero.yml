name: Prepare revised Services small hero
on:
  pull_request:
    branches: [redesign]
    paths:
      - public/images/services/HERO-SOURCES.json
      - .github/workflows/prepare-services-small-hero.yml
permissions:
  contents: write
jobs:
  replace-small-hero:
    if: github.event.pull_request.head.ref == 'feature/service-detail-pages' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Convert only small Services Hero image
        run: node scripts/prepare-services-hero-images.mjs hero-services-2.webp
      - name: Commit new WebP file to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/services/hero-services-2.webp
          if git diff --cached --quiet; then
            echo "No image content changed"
          else
            git commit -m "assets(services): replace small hero with premium office photo"
            git pull --rebase origin feature/service-detail-pages
            git push origin HEAD:feature/service-detail-pages
          fi
