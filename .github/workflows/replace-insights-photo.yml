name: Replace Insights featured WebP photo
on:
  push:
    branches: [feature/insights-page]
    paths: [.github/workflows/replace-insights-photo.yml]
permissions:
  contents: write
jobs:
  replace-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Download and convert selected Pexels photograph to local WebP
        run: |
          python - <<'PY'
          from urllib.request import urlopen, Request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps
          photo_id=35791381
          url=f"https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1800"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=40) as response:
              payload=response.read()
          with Image.open(BytesIO(payload)) as image:
              if image.format not in ('JPEG','PNG','WEBP'): raise ValueError(f"Unexpected format: {image.format}")
              picture=ImageOps.fit(image.convert('RGB'),(1200,800),method=Image.Resampling.LANCZOS)
          output=Path('public/images/insights/starting-a-business-in-dubai.webp')
          picture.save(output,'WEBP',quality=84,method=6)
          with Image.open(output) as check:
              assert check.format=='WEBP' and check.size==(1200,800)
          print(f"Saved {output}: {output.stat().st_size} bytes")
          PY
      - name: Commit photo replacement to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/insights/starting-a-business-in-dubai.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets(insights): replace first article with brighter Dubai Pexels photo"
          git push origin HEAD:feature/insights-page
