name: Prepare Insights Pexels WebP assets
on:
  push:
    branches: [feature/insights-page]
    paths:
      - .github/workflows/insights-assets.yml
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Download Pexels originals and build local WebP derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image, ImageOps
          images = {
              "starting-a-business-in-dubai": 29470839,
              "mainland-or-free-zone": 33719777,
              "understanding-uae-work-permits": 7652176,
              "family-residency-preparation": 14547467,
              "vat-registration-business-planning": 33175651,
              "renewing-a-dubai-trade-licence": 7433874,
          }
          target = Path("public/images/insights")
          target.mkdir(parents=True, exist_ok=True)
          for slug, photo_id in images.items():
              url = f"https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1800"
              with urlopen(Request(url, headers={"User-Agent":"Mozilla/5.0 (INBS editorial image sourcing)"}), timeout=35) as response:
                  raw = response.read()
              with Image.open(BytesIO(raw)) as source:
                  if source.format not in ("JPEG", "PNG", "WEBP"):
                      raise ValueError(f"{slug}: unexpected format {source.format}")
                  picture = ImageOps.fit(source.convert("RGB"), (1200, 800), method=Image.Resampling.LANCZOS, centering=(0.5,0.5))
                  output = target / f"{slug}.webp"
                  picture.save(output, "WEBP", quality=82, method=6)
                  with Image.open(output) as verified:
                      assert verified.format == "WEBP" and verified.size == (1200,800)
                  print(f"{output}: {output.stat().st_size} bytes; source {photo_id}")
          PY
      - name: Commit six WebP photos on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/insights/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets(insights): add six optimized Pexels WebP photos"
          git push origin HEAD:feature/insights-page
