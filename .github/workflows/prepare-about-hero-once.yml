name: Prepare About hero photo (one-time)
on:
  push:
    branches: [feature/about-page]
    paths:
      - .github/workflows/prepare-about-hero-once.yml
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false sharp
      - name: Prepare licensed About hero WebP
        run: node scripts/prepare-about-image.mjs
      - name: Commit only the converted image to the About feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/about/hero-about.webp
          git diff --cached --quiet && { echo 'No image was produced'; exit 1; }
          git commit -m "assets(about): add optimized licensed Dubai skyline WebP"
          git push origin HEAD:feature/about-page
