name: Prepare Insights Hero WebP
on:
  push:
    branches: [feature/insights-page]
    paths:
      - .github/workflows/insights-hero-photo.yml
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Convert original Pexels architecture photo to local WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image, ImageOps
          source_id=37466738
          url=f"https://images.pexels.com/photos/{source_id}/pexels-photo-{source_id}.jpeg?auto=compress&cs=tinysrgb&w=2400"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=40) as response:
              payload=response.read()
          with Image.open(BytesIO(payload)) as photo:
              assert photo.format in ('JPEG','PNG','WEBP'),photo.format
              image=ImageOps.fit(photo.convert('RGB'),(1920,1080),method=Image.Resampling.LANCZOS)
          path=Path("public/images/insights/insights-hero.webp")
          image.save(path,'WEBP',quality=82,method=6)
          with Image.open(path) as verified:
              assert verified.format=='WEBP' and verified.size==(1920,1080)
          print(f"{path}: {path.stat().st_size} bytes")
          PY
      - name: Commit optimized local hero photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/insights/insights-hero.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets(insights): add distinct Pexels hero photo in WebP"
          git push origin HEAD:feature/insights-page
