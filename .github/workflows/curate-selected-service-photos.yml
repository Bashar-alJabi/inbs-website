name: Curate selected service photos once
on:
  pull_request:
    branches: [redesign]
    paths:
      - scripts/replace-selected-service-photos.mjs
      - .github/workflows/curate-selected-service-photos.yml
permissions:
  contents: write
jobs:
  replace-selected-images:
    if: github.event.pull_request.head.ref == 'feature/service-detail-pages' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Replace twelve selected Pexels WebP files
        run: node scripts/replace-selected-service-photos.mjs
      - name: Commit only the twelve selected image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/services/businessmen-services.webp \
            public/images/services/financial-services.webp \
            public/images/services/consultation-services.webp \
            public/images/services/customs-services.webp \
            public/images/services/editorial/businessmen-services-01.webp \
            public/images/services/editorial/real-estate-services-01.webp \
            public/images/services/editorial/real-estate-services-02.webp \
            public/images/services/editorial/tourism-services-01.webp \
            public/images/services/editorial/tourism-services-02.webp \
            public/images/services/editorial/customs-services-01.webp \
            public/images/services/editorial/cargo-services-01.webp \
            public/images/services/editorial/citizenship-and-immigration-services-01.webp
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "assets(services): replace twelve selected photos with curated WebP"
            git push origin HEAD:feature/service-detail-pages
          fi
